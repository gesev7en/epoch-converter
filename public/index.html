<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPOCH · Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0b0c0f;
      --surface: #13151a;
      --border:  #1e2028;
      --border2: #2a2d38;
      --accent:  #e8ff47;
      --accent2: #47d4ff;
      --accent3: #ff9f47;
      --green:   #47ffb0;
      --purple:  #c47aff;
      --text:    #e8eaf0;
      --muted:   #555a6e;
      --danger:  #ff6b6b;
      --mono:    'Azeret Mono', monospace;
      --sans:    'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      padding: 48px 24px 80px;
    }

    /* Header */
    header { margin-bottom: 44px; }
    .logo {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.8); }
    }
    h1 {
      font-family: var(--mono);
      font-size: clamp(26px, 5.5vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    h1 span { color: var(--accent); }
    .subtitle { margin-top: 8px; font-size: 13px; color: var(--muted); font-weight: 300; }

    /* Input card */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 12px;
    }
    .field-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }
    .input-row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 13px 16px;
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      min-width: 0;
    }
    input[type="text"]::placeholder { color: var(--muted); font-weight: 300; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,255,71,.08); }
    input[type="text"].error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,107,107,.08); }
    .btn-convert {
      background: var(--accent);
      color: #0b0c0f;
      border: none;
      border-radius: 8px;
      padding: 13px 24px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, transform .1s;
    }
    .btn-convert:hover { background: #d4eb2e; }
    .btn-convert:active { transform: scale(.97); }
    .error-msg { font-family: var(--mono); font-size: 11px; color: var(--danger); margin-top: 8px; display: none; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .hint button {
      background: none; border: none;
      color: var(--accent2); font-family: var(--mono); font-size: 12px;
      cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px;
    }

    /* Results */
    #results { display: none; animation: slideUp .3s ease; margin-top: 24px; }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .sec-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Converted timestamp card */
    .result-main {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .result-main-header {
      background: linear-gradient(135deg, rgba(232,255,71,.06) 0%, transparent 60%);
      border-bottom: 1px solid var(--border2);
      padding: 20px 24px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .epoch-display { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: .1em; }
    .datetime-big { font-family: var(--mono); font-size: clamp(17px, 3.5vw, 24px); font-weight: 600; letter-spacing: -.01em; }
    .datetime-big .date-part { color: var(--accent); }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 16px 24px 20px;
    }
    .meta-key { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .meta-val { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text); }

    /* Copy all button */
    .btn-copy {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
      flex-shrink: 0;
    }
    .btn-copy:hover { background: rgba(232,255,71,.06); border-color: var(--accent); color: var(--accent); }
    .btn-copy.copied { background: rgba(232,255,71,.1); border-color: var(--accent); color: var(--accent); }

    /* Deadline cards */
    #deadlines-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

    .deadline-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .deadline-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .dl-c0::before { background: linear-gradient(90deg, var(--accent2), transparent); }
    .dl-c1::before { background: linear-gradient(90deg, var(--accent3), transparent); }
    .dl-c2::before { background: linear-gradient(90deg, var(--green), transparent); }
    .dl-c3::before { background: linear-gradient(90deg, var(--purple), transparent); }
    .dl-c4::before { background: linear-gradient(90deg, var(--accent), transparent); }

    .deadline-card-inner { padding: 18px 22px 20px; }
    .dl-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .dl-name {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .dl-c0 .dl-name { color: var(--accent2); }
    .dl-c1 .dl-name { color: var(--accent3); }
    .dl-c2 .dl-name { color: var(--green); }
    .dl-c3 .dl-name { color: var(--purple); }
    .dl-c4 .dl-name { color: var(--accent); }

    .dl-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .dl-date-big { font-family: var(--mono); font-size: clamp(15px, 3vw, 20px); font-weight: 600; color: var(--text); text-align: right; }
    .dl-epoch-small { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 3px; text-align: right; }

    .dl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

    /* Bottom strip */
    .utc-strip {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 14px 20px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .utc-key { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .utc-val { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text); }

    @media (max-width: 520px) {
      .input-row { flex-direction: column; }
      .btn-convert { width: 100%; text-align: center; }
      .meta-grid { grid-template-columns: 1fr; }
      .dl-grid { grid-template-columns: 1fr 1fr; }
      .dl-top { flex-direction: column; }
      .dl-date-big, .dl-epoch-small { text-align: left; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo"><span class="logo-dot"></span>Utility Tool</div>
    <h1>EPOCH<span>·</span>CONVERTER</h1>
    <p class="subtitle">Decode timestamps. Calculate configured deadlines.</p>
  </header>

  <div class="input-card">
    <label class="field-label" for="epochInput">Unix Timestamp (seconds or milliseconds)</label>
    <div class="input-row">
      <input type="text" id="epochInput" placeholder="e.g. 1713340800" autocomplete="off" spellcheck="false" />
      <button class="btn-convert" onclick="convert()">Convert</button>
    </div>
    <div class="error-msg" id="errorMsg">Please enter a valid EPOCH timestamp.</div>
    <div class="hint"><button onclick="useNow()">Use current time</button></div>
  </div>

  <div id="results">
    <div class="sec-label">Converted Timestamp</div>
    <div class="result-main">
      <div class="result-main-header">
        <div>
          <div class="epoch-display" id="resEpochLbl">—</div>
          <div class="datetime-big" id="resDatetimeBig">—</div>
        </div>
        <button class="btn-copy" id="btnCopy" onclick="copyAll()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy All
        </button>
      </div>
      <div class="meta-grid">
        <div><div class="meta-key">Local Time</div><div class="meta-val" id="resLocal">—</div></div>
        <div><div class="meta-key">UTC Time</div><div class="meta-val" id="resUTC">—</div></div>
        <div><div class="meta-key">Day of Week</div><div class="meta-val" id="resDOW">—</div></div>
        <div><div class="meta-key">ISO 8601</div><div class="meta-val" id="resISO">—</div></div>
        <div><div class="meta-key">Week of Year</div><div class="meta-val" id="resWeek">—</div></div>
        <div><div class="meta-key">Day of Year</div><div class="meta-val" id="resDOY">—</div></div>
      </div>
    </div>

    <div class="sec-label">Calculated Deadlines</div>
    <div id="deadlines-container"></div>

    <div class="utc-strip">
      <div><div class="utc-key">Unix (s)</div><div class="utc-val" id="stripS">—</div></div>
      <div><div class="utc-key">Unix (ms)</div><div class="utc-val" id="stripMs">—</div></div>
      <div><div class="utc-key">Relative</div><div class="utc-val" id="stripRel">—</div></div>
      <div><div class="utc-key">Timezone</div><div class="utc-val" id="stripTZ">—</div></div>
    </div>
  </div>

</div>
<script>
// =============================================================================
//  DEADLINE RULES CONFIG
//  Edit this array to add, remove, or change deadline rules.
//  The UI is read-only — only this config controls what deadlines are shown.
//
//  Available rule types and their required fields:
//
//  { name, type: 'last_day_of_month',   month: 1-12, yearsOffset: N }
//    → Last day of <month>, N years after the input timestamp's year
//    Example: last day of March, 2 years out
//
//  { name, type: 'first_day_of_month',  month: 1-12, yearsOffset: N }
//    → First day of <month>, N years after the input timestamp's year
//
//  { name, type: 'specific_date',       month: 1-12, day: 1-31, yearsOffset: N }
//    → Specific month/day, N years after the input timestamp's year
//
//  { name, type: 'end_of_year',         yearsOffset: N }
//    → December 31, N years after the input timestamp's year
//
//  { name, type: 'add_days',            days: N }
//    → Input timestamp + N days
//
//  { name, type: 'add_months',          months: N }
//    → Input timestamp + N months
//
//  { name, type: 'add_years',           years: N }
//    → Input timestamp + N years
// =============================================================================
const DEADLINE_RULES = [
  {
    name: 'Q1 End +2 Years',
    type: 'last_day_of_month',
    month: 3,           // March
    yearsOffset: 2,
  },
  {
    name: '90-Day Window',
    type: 'add_days',
    days: 90,
  },
  {
    name: 'Fiscal Year End +1',
    type: 'end_of_year',
    yearsOffset: 1,
  },
  {
    name: 'Renewal Date +3 Years',
    type: 'specific_date',
    month: 6,           // June
    day: 15,
    yearsOffset: 3,
  },
];
// =============================================================================
//  END OF CONFIG — do not edit below unless you know what you're doing
// =============================================================================

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY_NAMES   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function computeDeadline(rule, inputDate) {
  const y = inputDate.getUTCFullYear();
  switch (rule.type) {
    case 'last_day_of_month': {
      // Day 0 of the next month = last day of this month
      const target = new Date(Date.UTC(y + (rule.yearsOffset || 0), rule.month, 0, 23, 59, 59));
      return target;
    }
    case 'first_day_of_month': {
      return new Date(Date.UTC(y + (rule.yearsOffset || 0), rule.month - 1, 1, 0, 0, 0));
    }
    case 'specific_date': {
      return new Date(Date.UTC(y + (rule.yearsOffset || 0), rule.month - 1, rule.day, 23, 59, 59));
    }
    case 'end_of_year': {
      return new Date(Date.UTC(y + (rule.yearsOffset || 0), 11, 31, 23, 59, 59));
    }
    case 'add_days': {
      return new Date(inputDate.getTime() + (rule.days || 0) * 86400000);
    }
    case 'add_months': {
      const d = new Date(inputDate);
      d.setUTCMonth(d.getUTCMonth() + (rule.months || 0));
      return d;
    }
    case 'add_years': {
      const d = new Date(inputDate);
      d.setUTCFullYear(d.getUTCFullYear() + (rule.years || 0));
      return d;
    }
    default:
      throw new Error(`Unknown rule type: ${rule.type}`);
  }
}

function ruleDescription(rule) {
  switch (rule.type) {
    case 'last_day_of_month':  return `Last day of ${MONTH_NAMES[rule.month - 1]}, +${rule.yearsOffset} year(s) from input`;
    case 'first_day_of_month': return `First day of ${MONTH_NAMES[rule.month - 1]}, +${rule.yearsOffset} year(s) from input`;
    case 'specific_date':      return `${MONTH_NAMES[rule.month - 1]} ${rule.day}, +${rule.yearsOffset} year(s) from input`;
    case 'end_of_year':        return `December 31 (end of year), +${rule.yearsOffset} year(s) from input`;
    case 'add_days':           return `+${rule.days} days from input timestamp`;
    case 'add_months':         return `+${rule.months} months from input timestamp`;
    case 'add_years':          return `+${rule.years} years from input timestamp`;
    default: return rule.type;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }

function formatDateBig(d) {
  return `${pad(d.getUTCDate())} ${MONTH_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
function formatTimeBig(d) {
  return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
}
function formatLocal(d) {
  return d.toLocaleString(undefined, {
    year: 'numeric', month: 'short', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
}
function getWeekOfYear(d) {
  const start = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - start) / 86400000 + start.getUTCDay() + 1) / 7);
}
function getDayOfYear(d) {
  return Math.floor((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 0))) / 86400000);
}
function humanDuration(ms) {
  const sign = ms < 0 ? '− ' : '+ ';
  const abs = Math.abs(ms);
  const s = Math.floor(abs/1000), m = Math.floor(s/60), h = Math.floor(m/60),
        days = Math.floor(h/24), mo = Math.floor(days/30.44), y = Math.floor(days/365.25);
  let str;
  if      (y >= 1)  str = `${y}y ${Math.floor((days % 365.25) / 30.44)}mo`;
  else if (mo >= 1) str = `${mo}mo ${Math.floor(days % 30.44)}d`;
  else if (days>=1) str = `${days}d ${h%24}h`;
  else if (h >= 1)  str = `${h}h ${m%60}m`;
  else if (m >= 1)  str = `${m}m ${s%60}s`;
  else              str = `${s}s`;
  return sign + str;
}
function relativeNow(ts) {
  const diff = ts * 1000 - Date.now();
  const abs = Math.abs(diff);
  const s = Math.floor(abs/1000), m = Math.floor(s/60), h = Math.floor(m/60),
        days = Math.floor(h/24), y = Math.floor(days/365.25);
  let str;
  if      (y >= 1)    str = `${y}y`;
  else if (days >= 1) str = `${days}d`;
  else if (h >= 1)    str = `${h}h ${m%60}m`;
  else                str = `${m}m ${s%60}s`;
  return diff < 0 ? str + ' ago' : 'in ' + str;
}

// ── State ─────────────────────────────────────────────────────────────────────
let lastTs = null;
let lastDeadlines = [];

// ── Convert ───────────────────────────────────────────────────────────────────
function convert() {
  const raw = document.getElementById('epochInput').value.trim();
  const inp = document.getElementById('epochInput');
  const err = document.getElementById('errorMsg');
  inp.classList.remove('error');
  err.style.display = 'none';

  if (!raw || isNaN(raw)) {
    inp.classList.add('error');
    err.style.display = 'block';
    return;
  }

  let ts = Number(raw);
  if (ts > 1e12) ts = Math.floor(ts / 1000); // ms → s
  lastTs = ts;

  const d = new Date(ts * 1000);

  // Main result
  document.getElementById('resEpochLbl').textContent = `EPOCH: ${ts}`;
  document.getElementById('resDatetimeBig').innerHTML =
    `<span class="date-part">${formatDateBig(d)}</span>&nbsp;&nbsp;${formatTimeBig(d)}`;
  document.getElementById('resLocal').textContent  = formatLocal(d);
  document.getElementById('resUTC').textContent    = d.toUTCString().replace(' GMT', ' UTC');
  document.getElementById('resDOW').textContent    = DAY_NAMES[d.getUTCDay()];
  document.getElementById('resISO').textContent    = d.toISOString().replace('T', ' ').replace('.000Z', 'Z');
  document.getElementById('resWeek').textContent   = `Week ${getWeekOfYear(d)}`;
  document.getElementById('resDOY').textContent    = `Day ${getDayOfYear(d)}`;

  // Bottom strip
  document.getElementById('stripS').textContent   = ts;
  document.getElementById('stripMs').textContent  = ts * 1000;
  document.getElementById('stripRel').textContent = relativeNow(ts);
  document.getElementById('stripTZ').textContent  = Intl.DateTimeFormat().resolvedOptions().timeZone;

  // Deadline cards
  lastDeadlines = [];
  const container = document.getElementById('deadlines-container');
  container.innerHTML = '';

  DEADLINE_RULES.forEach((rule, i) => {
    const dl = computeDeadline(rule, d);
    const dlTs = Math.floor(dl.getTime() / 1000);
    lastDeadlines.push({ rule, dl, dlTs });

    const card = document.createElement('div');
    card.className = `deadline-card dl-c${i % 5}`;
    card.innerHTML = `
      <div class="deadline-card-inner">
        <div class="dl-top">
          <div>
            <div class="dl-name">${esc(rule.name)}</div>
            <div class="dl-desc">${esc(ruleDescription(rule))}</div>
          </div>
          <div>
            <div class="dl-date-big">${formatDateBig(dl)}</div>
            <div class="dl-epoch-small">${formatTimeBig(dl)}</div>
          </div>
        </div>
        <div class="dl-grid">
          <div><div class="meta-key">EPOCH (s)</div><div class="meta-val">${dlTs}</div></div>
          <div><div class="meta-key">EPOCH (ms)</div><div class="meta-val">${dlTs * 1000}</div></div>
          <div><div class="meta-key">From Input</div><div class="meta-val">${humanDuration(dl - d)}</div></div>
          <div><div class="meta-key">From Now</div><div class="meta-val">${humanDuration(dl - new Date())}</div></div>
        </div>
      </div>`;
    container.appendChild(card);
  });

  document.getElementById('results').style.display = 'block';

  // Reset copy button
  const btn = document.getElementById('btnCopy');
  btn.classList.remove('copied');
  btn.innerHTML = copyIcon() + ' Copy All';
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyIcon() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
}

function copyAll() {
  if (!lastTs) return;
  const d = new Date(lastTs * 1000);
  let text = `EPOCH Timestamp : ${lastTs}\n`;
  text += `Converted       : ${d.toISOString().replace('T',' ').replace('.000Z',' UTC')}\n`;
  text += `Local           : ${formatLocal(d)}\n`;
  text += `\n`;
  lastDeadlines.forEach(({ rule, dl, dlTs }) => {
    text += `── ${rule.name}\n`;
    text += `   Rule    : ${ruleDescription(rule)}\n`;
    text += `   Date    : ${dl.toISOString().replace('T',' ').replace('.000Z',' UTC')}\n`;
    text += `   EPOCH   : ${dlTs}\n\n`;
  });
  navigator.clipboard.writeText(text.trim()).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = copyIcon() + ' Copy All';
    }, 2500);
  });
}

function useNow() {
  document.getElementById('epochInput').value = Math.floor(Date.now() / 1000);
  convert();
}

document.getElementById('epochInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') convert();
});
</script>
</body>
