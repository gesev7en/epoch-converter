---
# Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epoch-converter
  labels:
    app: epoch-converter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: epoch-converter
  template:
    metadata:
      labels:
        app: epoch-converter
    spec:
      containers:
        - name: epoch-converter
          image: your-registry/epoch-converter:latest  # replace with your image
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
# Kubernetes Service
apiVersion: v1
kind: Service
metadata:
  name: epoch-converter
spec:
  selector:
    app: epoch-converter
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
# Optional: Ingress (adjust host/class to your setup)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epoch-converter
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: epoch.yourdomain.com   # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epoch-converter
                port:
                  number: 80
